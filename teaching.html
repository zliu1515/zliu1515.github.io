<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teaching | Zhen Liu</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700
        &family=Merriweather:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* ── Teaching-specific styles ── */

    /* Page Header */
    .page-header {
      background: linear-gradient(135deg, var(--primary) 0%, #2c5282 100%);
      color: #fff;
      padding: 3rem 0 2.5rem;
    }
    .page-header h1 {
      font-family: 'Merriweather', serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .page-header p {
      font-size: 0.97rem;
      color: rgba(255,255,255,0.85);
      max-width: 680px;
    }

    /* Teaching Philosophy Box */
    .philosophy-box {
      background: #eaf4fb;
      border-left: 4px solid var(--accent);
      padding: 1.2rem 1.5rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: 0.93rem;
      line-height: 1.8;
      color: var(--text);
    }
    .philosophy-box i {
      color: var(--accent);
      margin-right: 0.4rem;
    }

    /* Course Stats Bar */
    .stats-bar {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }
    .stat-item {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      text-align: center;
      flex: 1;
      min-width: 130px;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-light);
      display: block;
    }
    .stat-label {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.8);
      margin-top: 0.2rem;
    }

    /* Section Divider */
    .course-section-label {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 2rem 0 1rem;
    }

      font-family: 'Merriweather', serif;
      font-size: 1.05rem;
      color: var(--primary);
